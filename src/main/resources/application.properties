spring.application.name=payments-service
server.port=${PORT:8080}

# Database: Spring binds SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD from the environment.
# TODO: confirm the variable names JengaSec injects for its PostgreSQL 16 (Image Submission Guide).
spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.username=payments
spring.datasource.password=payments
spring.datasource.hikari.maximum-pool-size=10

# Schema is owned by Flyway migrations (run on startup); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# OpenAPI document at /openapi.json; no Swagger UI is shipped.
springdoc.api-docs.path=/openapi.json

# Never leak internals in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.server-header=

# Actuator is not on the classpath; health is served by HealthController.
